name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  checks: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-container:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: ./buildContainer.ps1
        working-directory: src
        shell: pwsh
      - run: docker push ghcr.io/mitchfen/nanoleaf-controller:latest 

  cleanup:
    needs: publish-container
    name: Cleanup untagged container images
    runs-on: ubuntu-latest
    steps:
      - uses: mitchfen/cleanup-untagged-container-images@v1
        with:
          username: 'mitchfen'
          container-name: 'nanoleaf-controller'
          token: ${{ secrets.GHCR_TOKEN }}
