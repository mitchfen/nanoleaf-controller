apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanoleafcontroller-ingress
  annotations:    
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: nanoleaf-controller.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nanoleafcontroller-service
            port:
              number: 80
